services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${APP_TIME_ZONE}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: ./backend
    container_name: node_app
    restart: always
    expose:
      - "3000"
    depends_on:
      - db
      - document
    networks:
      - default
      - document_internal
    environment:
      DOCUMENT_PREVIEW_URL: http://document:3001
      NODE_ENV: production
      APP_TIME_ZONE: ${APP_TIME_ZONE}
      DATABASE_HOST: db
      DATABASE_PORT: ${DATABASE_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - /root/portal-media:/app/media

  document:
    build: ./document-preview
    restart: always
    networks:
      - document_internal
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    image: nginx:alpine
    container_name: nginx_web
    restart: always
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

networks:
  document_internal:
    internal: true

volumes:
  postgres_data: